<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship Game</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header>
        <h1 class="text-center p-3">Spaceship Game</h1>
    </header>
    <main>
        <div class="container">
            <div class="d-flex">
                <div class="start">
                    <button type="button" class="btn btn-dark startButton">Start</button>
                </div>
                <div class="score">
                    <h2 class="p-2">Score: <strong class="scoredisplay">0</strong></h2>
                </div>
                <div class="stop">
                    <button type="button" class="btn btn-dark stopButton">Stop</button>
                </div>
            </div>
            <section></section>
        </div>
    </main>
    <footer>
        <p class="text-center p-3">&copy; All rights reserved!</p>
    </footer>
    <script src="js/Enemy.js"></script>
    <script src="js/Laser.js"></script>
    <script src="/js/script.js"></script>







</body>

</html>
